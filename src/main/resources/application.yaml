spring:
  application:
    name: spring-ai-1
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-5.5
      embedding:
        options:
          model: text-embedding-3-small
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
        distance-type: COSINE_DISTANCE
  datasource:
    url: jdbc:postgresql://localhost:5432/memory_db
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

logging:
  level:
    org:
      springframework:
        ai: TRACE